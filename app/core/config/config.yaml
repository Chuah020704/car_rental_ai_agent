# Static, non-secret tunables. Secrets (API keys, JWT signing key) live in .env —
# see app/utils/config.py for how the two are composed into one Settings object.

SETTINGS:
  OPENAPI_DOCS: true
  MODEL_SERVICE:
    LLM:
      DEFAULT: GOOGLE
      GOOGLE: ["gemini-2.0-flash", "gemini-1.5-pro"]
      OPENAI: ["gpt-4o", "gpt-4o-mini"]
      ANTHROPIC: ["claude-sonnet-4-5", "claude-haiku-4-5"]
      MAX_TOKENS: 2048
      TEMPERATURE: 0.2
      TOP_P: 0.95
    EMBEDDING:
      LOCAL_MODEL: "BAAI/bge-small-en-v1.5"
      GOOGLE_MODEL: "models/text-embedding-004"
      OPENAI_MODEL: "text-embedding-3-small"
      DIMENSION: 384

RAG:
  CHUNK_SIZE: 800
  CHUNK_OVERLAP: 120
  TOP_K: 4
  # Empirically calibrated against the local fastembed/bge-small model: relevant
  # chunks score ~0.41, irrelevant ones ~0.83+ — see docs/LEARNING_NOTES.md Phase 3.
  COSINE_DISTANCE_THRESHOLD: 0.5
  COLLECTION_NAME: "policies"
  PERSIST_DIR: ".chroma"

AGENT:
  MAX_TOOL_ITERATIONS: 10
  RETRY_MAX: 3
  RETRY_DELAY: 1.0
  RECURSION_LIMIT: 25
  CHECKPOINT_DB: ".checkpoints/agent.sqlite"

RATE_LIMIT:
  MAX_REQUESTS: 100
  WINDOW_SECONDS: 60
